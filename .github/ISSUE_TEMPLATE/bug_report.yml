name: Bug report
description: Something does not work as described in the README
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the [README](https://github.com/mttfntn/resource-safeguard-blender#how-it-works) first, including the [known limits](https://github.com/mttfntn/resource-safeguard-blender#known-limits), and whether an issue for the same problem already exists.

  - type: input
    id: blender
    attributes:
      label: Blender version
      description: Help › About Blender. Resource Safeguard supports Blender 5.3 only.
      placeholder: "5.3.0"
    validations:
      required: true

  - type: input
    id: addon
    attributes:
      label: Resource Safeguard version
      description: Edit › Preferences › Get Extensions (or Add-ons) › Resource Safeguard
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: engine
    attributes:
      label: Render engine
      description: The engine of the Rendered viewport, if it matters.
      placeholder: "Cycles, EEVEE, Octane..."

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Your settings (idle time, Pause Animation, Render → Solid) and the exact steps that lead to the problem.
      placeholder: |
        1. Idle time 15 s, Pause Animation on, Render → Solid on
        2. Switch a viewport to Rendered and start playback
        3. Leave Blender alone for 20 s
        4. ...
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Screenshots or a .blend file
      description: Drag images here (a screenshot of the top bar helps). A small .blend that shows the problem helps most (zip it to attach it).

  - type: textarea
    id: console
    attributes:
      label: Error messages
      description: Messages starting with "Resource Safeguard:" in the system console (Window › Toggle System Console on Windows), or any Blender error.
      render: shell
